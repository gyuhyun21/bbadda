# 수집 소스 설정. 키가 없는 소스는 건너뛰고 logs/collect-<주차>.json 에 이유를 남긴다.
http:
  user_agent: "BBADDA-collector/0.1 (+https://bbadda.com/about)"
  min_interval_ms: 800
  timeout_ms: 15000

# 한 번 실행(하루)에 팀·모듈별로 남기는 최대 건수. 팬 반응(fans)은 출처별(YouTube·블로그/카페·커뮤니티)로 각각. 넘으면 점수 상위만 남긴다(2026-10-17: 주 단위 → 실행당, 매일 갱신에 맞춤)
max_per_team_per_run: { team: 15, fans: 8, rivalry: 8 }
max_league_per_run: 15

# 제목이 이 정규식에 맞으면 버린다(도박·광고 스팸 사이트)
exclude_title_patterns: ["카지노", "토토 ?사이트", "먹튀", "슬롯", "바카라", "도박 (게임|옵션|사이트)", "옵션 설명", "게임 탐색"]

# 사진 보강(npm run enrich): 요약을 쓴 뉴스의 원 기사 주소를 풀고 대표 이미지 주소(og:image)만 찾는다. 이미지 파일은 저장하지 않는다.
# 화면 표시 여부는 config/site.yaml news_images 가 정한다.
enrich: { resolve_google_news: true, og_image: false, max_items: 80 } # og_image: 뉴스 사진을 쓰지 않으므로 끔(2026-10-19)

news_rss:
  enabled: true
  when: 1d               # 구글 뉴스 기간. 구글 뉴스 검색은 관련도순이라 7d 면 상위 40건이 대부분 이미 실린 옛 기사 → 새 기사가 거의 안 들어왔다(2026-10-20 확인: 7d 상위 40건 중 24시간 안 8건, 1d 는 40건 모두). 하루 3번 돌므로 1d 로 충분
  max_items_per_feed: 100  # 구글 뉴스 RSS 한 번에 최대 100건
  locale: { hl: ko, gl: KR, ceid: "KR:ko" }
  # 리그 전체 검색어(제도·일정·중계·흥행). 팀별 검색어는 teams.yaml news_queries
  league_queries: ["KBO 리그", "프로야구 일정", "KBO 포스트시즌", "한국시리즈", "프로야구 중계", "프로야구 관중", "KBO FA", "KBO 신인 드래프트"]

youtube:
  enabled: true          # YOUTUBE_API_KEY 또는 YOUTUBE_AUTH=proxy 필요
  units_budget: 3000     # 한 번 실행 상한(하루 무료 할당량 10,000)
  max_results_per_query: 10
  lookback_days: 3
  team_search: true      # 팀 이름 검색(검색 1회 = 100 units)
  # 제목이 이 정규식에 맞는 영상은 버린다 — 치어리더 직캠은 소식이 아니다(2026-10-16 실측: 팬 반응의 큰 비중)
  exclude_title_patterns: ["치어리더", "cheerleader", "fan ?cam", "직캠"]

kakao:
  enabled: true          # KAKAO_REST_KEY 또는 KAKAO_AUTH=proxy 필요
  targets: [cafe, blog]
  size: 30
  max_pages: 1
  # 광고·판매 글(반응이 아님)
  ad_patterns: ["최저가", "특가", "할인", "쿠폰", "체험단", "협찬", "판매", "중고", "유니폼 팝니다", "양도", "티켓 ?(양도|판매)",
    "패치", "와펜", "자수", "마킹", "근무", "구인", "알바", "관련주", "숙소", "호텔", "예약", "분양"]   # 2026-10-17 실측 잡음 추가
  # 카페·블로그 이름이 이 정규식에 맞으면 버린다 — 전화번호를 이름에 넣은 가게 카페(2026-10-17 실측)
  exclude_source_patterns: ["\\d{2,4}[-)]\\s?\\d{3,4}-?\\d{4}", "010-?\\d{4}"]

instagram:
  enabled: true          # INSTAGRAM_USER_ID + INSTAGRAM_TOKEN(또는 INSTAGRAM_AUTH=proxy) 필요. 계정은 teams.yaml 의 instagram
  media_per_account: 8

vertex:
  enabled: true          # VERTEX_ENGINE + VERTEX_API_KEY(또는 VERTEX_AUTH=proxy) 필요. 계정당 매달 10,000회 무료
  max_queries: 60        # 한 번 실행 상한. 매일 실행 × 31일 = 최대 1,860회
  page_size: 10
  order_by: date         # 최신순('date desc' 아님)
  lookback_days: 14      # 구글 색인이 1~3주 늦다
  sites:
    - { host: mlbpark.donga.com, name: 엠엘비파크 }
    - { host: gall.dcinside.com, name: 디시 야구 갤러리 }
    - { host: theqoo.net, name: 더쿠 }
    - { host: fmkorea.com, name: 에펨코리아 }
    - { host: reddit.com, path: /r/KBO, name: "레딧 r/KBO", lang: en }
  # 은어: 일부러 찾지 않는다. 수집된 글 제목에 있으면 표시만 한다. { pattern: 정규식, term: 표기 }
  slang: []
