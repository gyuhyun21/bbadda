# 점수 (0~100). 규칙 기반 휴리스틱이라 오차가 있다 — 편집자가 조정.
hot:
  views: 0.6          # 조회수(로그 스케일, 같은 실행 최대값 대비)
  engagement: 0.4     # (좋아요+댓글)/조회
  recency_news: 0.6   # 지표 없는 뉴스: 최신성
  cluster_news: 0.4   # 지표 없는 뉴스: 같은 소식을 다룬 매체 수
relevance:
  team: 50            # 제목에 팀 이름
  player: 20          # 제목에 확인된 로스터 선수 이름(teams.yaml players)
  baseball_term: 20   # 제목에 야구 일반어
  league_query: 10    # 리그 검색어로 들어옴
# 야구 일반어 — 짧은 팀 이름(LG·삼성 등)은 이 단어가 제목에 함께 있어야 팀 기사로 본다.
# 제목에 팀 이름이 없는 글을 검색어의 팀으로 볼 때도 이 단어가 있어야 한다. 그래서 도시 이름·'경기'·'시즌'처럼 넓은 말은 넣지 않는다(2026-10-16)
