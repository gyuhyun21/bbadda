# 사이트 화면 설정
# layout: soft(apple + 누르는 요소에만 뉴모피즘, 구단 레일, 2026-10-17 도입) | apple(애플 디자인 지침) | magazine | classic.
#   마음에 들지 않으면 이 한 줄을 apple 로 바꿔 머지하면 바로 이전 화면으로 돌아간다.
#   배포 환경변수 SITE_LAYOUT 이 있으면 이 값보다 우선한다.
layout: soft
# community_section: 커뮤니티 검색 글을 모은 작은 Community 섹션. false 면 팬 반응 모듈에 섞는다.
#   환경변수 SITE_COMMUNITY=on|off 가 우선.
community_section: true
# home: 첫 화면. front — 매일 바뀌는 스포츠 1면(헤드라인·10개 구단 한눈에·리그·오피셜 영상·팬 반응·날짜별 소식, 2026-10-16 도입)
#   simple — 팀 선택 + 최근 소식 격자(이전 화면). 마음에 들지 않으면 이 한 줄을 simple 로 바꿔 머지한다. 환경변수 SITE_HOME 이 우선.
home: front
# news_images: 뉴스 카드에 원 기사의 대표 사진을 원 매체 주소로 표시(파일은 저장하지 않음, 사진 위에 매체명 표기).
#   false 로 바꾸면 사진 없이 글자 커버만 쓴다. 배포 환경변수 SITE_NEWS_IMAGES=on|off 가 우선(저장소 주인 결정, 2026-10-16).
news_images: false # 저작권 위험으로 끔(저장소 주인 결정, 2026-10-19) — 뉴스 카드는 글자 커버
# news_cover: 사진 없는 뉴스 카드 커버. text — 팀 컬러 바탕에 구단명·매체명 글자(제목은 아래에만, 2026-10-20 도입) | typo — 제목 글자 커버(이전 화면).
#   마음에 들지 않으면 typo 로 바꿔 머지한다. 환경변수 SITE_NEWS_COVER=text|typo 우선.
news_cover: text
# section_tint: 첫 화면 섹션마다 배경을 기존 색(#ECEFF4)과 같은 푸른 회색 계열로 밝기만 달리 깐다(톤온톤 둥근 판, 2026-10-24 주인 결정).
#   마음에 들지 않으면 false 로 바꿔 머지한다(이전 화면). 환경변수 SITE_SECTION_TINT=on|off 우선.
section_tint: true
# article_modal: 기사를 누르면 새 탭 대신 사이트 안 모달 브라우저로 연다(배경 흐림, 닫기·✕·Esc). false 면 새 탭. 환경변수 SITE_MODAL=on|off 우선(2026-10-17 도입).
#   YouTube·Instagram 은 공식 퍼가기 화면으로 연다. 아래 매체는 다른 사이트 안에 띄우는 것을 막아 두어(2026-10-17 확인) 요약과 '원문 보기'만 보여 준다.
article_modal: true
# blocked_open: 위 목록처럼 모달에 못 띄우는 매체를 누르면 어떻게 열지(2026-10-18 도입).
#   window — PC 는 작은 창, 모바일은 같은 탭(뒤로가기로 돌아옴) | tab — 항상 새 탭 | same — 항상 같은 탭 | modal — 이전처럼 모달 안에 요약과 '원문 보기'.
#   환경변수 SITE_BLOCKED_OPEN=window|tab|same|modal 이 우선. 작은 창이 막히면(팝업 차단) 새 탭으로 연다.
blocked_open: window
# '*' = 모든 기사·커뮤니티 사이트를 우리 페이지 안(iframe)에 띄우지 않고 blocked_open(작은 창)으로 연다 — 프레이밍 위험 제거(저장소 주인 결정, 2026-10-19). YouTube·Instagram 은 공식 퍼가기라 모달 유지.
modal_blocked_hosts: ['*', mt.co.kr, starnewskorea.com, fmkorea.com, news.google.com, fnnews.com, kyeonggi.com, famtimes.co.kr, xportsnews.com, theqoo.net, mlbpark.donga.com] # 더쿠·엠엘비파크는 빈 화면 확인(2026-10-18).  응답 헤더(X-Frame-Options·frame-ancestors)로 다른 사이트 안 표시를 막는 것을 확인(2026-10-18). fmkorea 는 빈 화면 확인(2026-10-17)
# postseason_bracket: 첫 화면 맨 위 가을야구 대진(data/postseason.yaml). 포스트시즌이 끝나면 false. 환경변수 SITE_POSTSEASON=on|off 우선(2026-10-17 도입).
postseason_bracket: true
# section_headings: 섹션 제목 위 눈썹 라벨(POSTSEASON·TOP STORIES 등)과 굵은 구분선. false 면 이전의 제목만 있는 화면. 환경변수 SITE_HEADINGS=on|off 우선(2026-10-17 도입).
section_headings: true
# brand_logo: 헤더의 BBADDA 빠따닷컴 로고 이미지(public/brand/bbadda-logo.webp, 저장소 주인 제작, 2026-10-17). false 면 글자 로고. 환경변수 SITE_BRAND_LOGO=on|off 우선.
brand_logo: true
# team_logos: 애칭 캐릭터 마크(public/mascots/<id>.svg, 우리가 그림 — 구단 정식 로고는 쓰지 않음, 저장소 주인 결정 2026-10-19). false 면 팀 컬러 이니셜 배지. 환경변수 SITE_LOGOS=on|off 우선.
team_logos: true
revisit: true # 재방문 장치: 승부예측 적중 기록 + 지난 방문 이후 새 소식(NEW·개수) 표시. false 면 둘 다 숨김(저장소 주인 결정, 2026-10-19)
push: true # 첫 화면 '경기 알림 받기'(웹 푸시). false 면 버튼 숨김. 발송은 .github/workflows/push.yml(저장소 주인 결정, 2026-10-19)
# insta_yt_thumbs: 인스타 세트에 구단·KBO 공식 유튜브 영상 썸네일(i.ytimg.com)을 넣는다. 출처(채널) 표기 필수. 뉴스·통신사 사진은 쓰지 않는다.
#   공식 썸네일도 저작권은 구단·KBO 에 있다 — 문제 제기가 오면 false 로 끄고 해당 게시물을 내린다(저장소 주인 결정, 2026-10-23). 환경변수 INSTA_YT_THUMBS=on|off 우선.
insta_yt_thumbs: true
# mascot_style: 팀 마스코트 그림. emblem — 원형 엠블럼(구단 애칭 마스코트, 팀 색 모자, Higgsfield 로 생성, 저장소 주인 결정 2026-10-23, public/mascots/emblem)
#   classic — 이전 캐릭터(public/mascots/<id>.svg). 마음에 들지 않으면 classic 으로 바꿔 머지. 환경변수 SITE_MASCOT=emblem|classic 우선. 사이트·인스타 세트 모두 적용
mascot_style: emblem
# matchup_posters: 대진 포스터(두 팀 마스코트 맞대결 그림, public/matchups/<팀id-팀id>.webp, Higgsfield 로 생성, 저장소 주인 결정 2026-10-23).
#   사이트 '다음 경기' 카드 위와 인스타 경기 전 세트 첫 장에 들어간다. 그림이 없는 대진은 이전 모양. false 로 끄면 둘 다 이전 모양. 환경변수 SITE_POSTERS=on|off 우선.
matchup_posters: true
