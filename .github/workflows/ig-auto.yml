# 인스타 자동 게시(피드 하루 1번 = 밤판, 2026-10-26 주인): 루틴이 콘텐츠를 main 에 머지하면 그 시간대 세트(scripts/insta/build.ts)를 만들고, 자동 실행은 밤판만 게시한다.
# 되돌리기: 저장소 변수 IG_FEED_KINDS 를 'morning afternoon night' 로 두면 예전처럼 하루 3번. 수동 실행(kind 지정)은 이 제한을 받지 않는다.
# 1) build: scripts/insta/build.ts → 크롬으로 JPEG → insta-media 브랜치 <key>/ 에 올림(공개 주소). 조건이 안 맞거나 이미 게시한 key 면 건너뜀
# 2) publish: environment 'instagram'(승인 단계 없음 — 2026-10-21 제거, 다시 켜려면 환경에 필수 승인자 추가). 게시하고 게시 기록을 insta-media 에 남김
# 수동 실행: kind(auto|morning|afternoon|night), date(YYYY-MM-DD, 지난 세트 다시 만들기), dry_run(true 면 만들기만)
name: ig-auto
on:
  push:
    branches: [main]
    paths: ['src/content/**', 'data/postseason.yaml']
  workflow_dispatch:
    inputs:
      kind: { description: 'auto | morning | afternoon | night', default: auto }
      date: { description: '날짜(비우면 오늘, KST)', default: '' }
      dry_run: { description: 'true 면 게시하지 않고 미리보기만', default: 'false' }
concurrency: { group: ig-auto, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      key: ${{ steps.make.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 세트 만들기
        id: make
        env:
          KIND: ${{ inputs.kind || 'auto' }}
          INSTA_DATE: ${{ inputs.date }}
          FEED_KINDS: ${{ vars.IG_FEED_KINDS || 'night' }}
        run: |
          set -euo pipefail
          [[ "$KIND" =~ ^(auto|morning|afternoon|night|pregame|postgame)$ ]] || { echo "잘못된 kind"; exit 1; }
          out=$(npx tsx scripts/insta/build.ts "$KIND" /tmp/set)
          echo "$out" > /tmp/result.json
          if jq -e .skip /tmp/result.json >/dev/null; then echo "건너뜀: $(jq -r .skip /tmp/result.json) ($(jq -r .kind /tmp/result.json))" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "$KIND" = auto ] && ! grep -qw "$(jq -r .kind /tmp/result.json)" <<< "$FEED_KINDS"; then echo "건너뜀: 자동 게시는 $FEED_KINDS 만 ($(jq -r .kind /tmp/result.json))" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          key=$(jq -r .key /tmp/result.json)
          git fetch -q origin insta-media 2>/dev/null || true
          if git cat-file -e "origin/insta-media:$key/published.json" 2>/dev/null; then echo "이미 게시함: $key" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: 그림 찍기(JPEG)
        if: steps.make.outputs.key != ''
        run: |
          set -euo pipefail
          # 2026-10-24: 이 단계가 15분 멈춰 아침 세트가 취소됨 → 설치·찍기마다 시간 제한과 재시도
          for t in 1 2 3; do timeout 300 sudo apt-get -qq update >/dev/null && timeout 300 sudo apt-get -qq install -y fonts-noto-cjk imagemagick >/dev/null && break; echo "apt 재시도 $t"; sleep 10; done
          mkdir -p /tmp/img
          n=$(jq -r '.n // 5' /tmp/result.json)
          for s in $(seq 1 "$n") story; do
            h=1350; [ "$s" = story ] && h=1920
            for t in 1 2 3; do timeout 90 google-chrome --headless=new --no-sandbox --hide-scrollbars --allow-file-access-from-files --window-size=1080,$h --virtual-time-budget=3000 --screenshot=/tmp/img/$s.png "file:///tmp/set/index.html?s=$s" >/dev/null 2>&1 && [ -s /tmp/img/$s.png ] && break; echo "찍기 재시도 $s/$t"; done
            convert /tmp/img/$s.png -quality 92 /tmp/img/$s.jpg
          done
      - name: insta-media 브랜치에 올리기
        if: steps.make.outputs.key != ''
        env:
          KEY: ${{ steps.make.outputs.key }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add -q /tmp/media origin/insta-media 2>/dev/null || { git worktree add -q --orphan -b insta-media /tmp/media; }
          cd /tmp/media
          git checkout -q -B insta-media
          mkdir -p "$KEY"; cp /tmp/img/*.jpg "$KEY/"
          jq '{images: [range(1; (.n // 5) + 1) | "\(.).jpg"], caption}' /tmp/result.json > "$KEY/post.json"
          git add "$KEY"; git commit -qm "insta: $KEY 세트"; git push -q origin insta-media
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/insta-media/$KEY"
          { echo "## $KEY"; for s in $(seq 1 "$(jq -r '.n // 5' /tmp/result.json)"); do echo "<img src=\"$raw/$s.jpg\" width=\"180\">"; done; echo; echo "스토리: [story.jpg]($raw/story.jpg)"; echo; echo '```'; jq -r .caption /tmp/result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: build
    if: needs.build.outputs.key != '' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: instagram
    steps:
      - uses: actions/checkout@v4
      - name: 게시
        env:
          TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          IG: ${{ vars.INSTAGRAM_USER_ID }}
          KEY: ${{ needs.build.outputs.key }}
        run: |
          set -euo pipefail
          git fetch -q origin insta-media
          if git cat-file -e "origin/insta-media:$KEY/published.json" 2>/dev/null; then echo "이미 게시함"; exit 0; fi
          git show "origin/insta-media:$KEY/post.json" > /tmp/post.json
          res=$(bash scripts/insta/publish.sh "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/insta-media/$KEY" /tmp/post.json)
          echo "게시: $res" | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add -q /tmp/media origin/insta-media && cd /tmp/media && git checkout -q -B insta-media
          echo "$res" > "$KEY/published.json"; git add "$KEY/published.json"; git commit -qm "insta: $KEY 게시"; git push -q origin insta-media
