# 매일 오전 11시(KST) 알림 1개: 경기 있는 날은 경기 안내, 없는 날은 오늘 소식 3줄 요약(scripts/push-daily.ts). 2026-10-24 주인 결정
# GitHub 예약 실행은 몇~십여 분 늦을 수 있다. 시크릿 PUSH_SECRET 은 출력하지 않는다
name: push-daily
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run: { description: 'true 면 문구만 보고 보내지 않음', default: 'true' }
permissions: { contents: read }
concurrency: { group: push-daily, cancel-in-progress: false }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 문구 만들기
        id: msg
        run: |
          m=$(npx tsx scripts/push-daily.ts)
          echo "json=$m" >> "$GITHUB_OUTPUT"
          echo "알림: $m" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 발송
        if: steps.msg.outputs.json != 'null' && steps.msg.outputs.json != '' && (github.event_name == 'schedule' || inputs.dry_run == 'false')
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          MSG: ${{ steps.msg.outputs.json }}
        run: |
          r=$(curl -sS -f -X POST https://bbadda.com/api/push-send -H "Authorization: Bearer $PUSH_SECRET" -H 'Content-Type: application/json' -d "$MSG")
          echo "발송: $r" | tee -a "$GITHUB_STEP_SUMMARY"
