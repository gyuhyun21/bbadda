# 인스타 게시(수동 실행): public/insta/<post>/post.json 의 이미지(bbadda.com 공개 주소)와 본문으로 카루셀을 올린다.
# 사람이 미리보기를 승인한 게시물만 실행한다. 시크릿 INSTAGRAM_PAGE_TOKEN, 변수 INSTAGRAM_USER_ID. 토큰은 출력하지 않는다.
name: ig-post
on:
  workflow_dispatch:
    inputs:
      post:
        description: public/insta 아래 폴더 이름(예 2026-10-19-intro)
        required: true
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 게시
        env:
          TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          IG: ${{ vars.INSTAGRAM_USER_ID }}
          POST: ${{ inputs.post }}
        run: |
          set -euo pipefail
          [[ "$POST" =~ ^[0-9a-z-]+$ ]] || { echo "잘못된 폴더 이름"; exit 1; }
          DIR="public/insta/$POST"; BASE="https://bbadda.com/insta/$POST"
          G="https://graph.facebook.com/v21.0"; AUTH="Authorization: Bearer $TOKEN"
          for f in $(jq -r '.images[]' "$DIR/post.json"); do curl -sS -f -o /dev/null "$BASE/$f" || { echo "이미지 주소 없음: $BASE/$f (배포 확인)"; exit 1; }; done
          ids=()
          for f in $(jq -r '.images[]' "$DIR/post.json"); do
            id=$(curl -sS -f -X POST -H "$AUTH" "$G/$IG/media" --data-urlencode "image_url=$BASE/$f" -d is_carousel_item=true | jq -r .id)
            ids+=("$id")
          done
          children=$(IFS=,; echo "${ids[*]}")
          cap=$(jq -r .caption "$DIR/post.json")
          if [ "${#ids[@]}" -gt 1 ]; then
            cid=$(curl -sS -f -X POST -H "$AUTH" "$G/$IG/media" -d media_type=CAROUSEL -d "children=$children" --data-urlencode "caption=$cap" | jq -r .id)
          else
            cid=$(curl -sS -f -X POST -H "$AUTH" "$G/$IG/media" --data-urlencode "image_url=$BASE/$(jq -r '.images[0]' "$DIR/post.json")" --data-urlencode "caption=$cap" | jq -r .id)
          fi
          for i in $(seq 1 30); do
            st=$(curl -sS -f -H "$AUTH" "$G/$cid?fields=status_code" | jq -r .status_code)
            [ "$st" = "FINISHED" ] && break; [ "$st" = "ERROR" ] && { echo "컨테이너 오류"; exit 1; }; sleep 5
          done
          mid=$(curl -sS -f -X POST -H "$AUTH" "$G/$IG/media_publish" -d "creation_id=$cid" | jq -r .id)
          curl -sS -f -H "$AUTH" "$G/$mid?fields=permalink,timestamp" | jq '{permalink, timestamp}'
