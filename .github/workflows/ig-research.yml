# 인스타 계정 분석(수동 실행 + 매주 월요일): 공식 Business Discovery 로 다른 비즈니스·크리에이터 계정의 팔로워 수와 최근 게시물 지표(좋아요·댓글·조회수 view_count)를 조회한다.
# 본문은 저장하지 않고 길이·해시태그 수·첫 줄 앞부분(40자)만 남긴다(분석용). 결과는 아티팩트 ig-research.json
name: ig-research
on:
  schedule:
    - cron: '7 0 * * 1' # 월요일 09:07 KST
  workflow_dispatch:
    inputs:
      usernames: { description: '쉼표로 구분한 인스타 아이디(비우면 기본 목록 config/insta-research.txt)', default: '' }
      limit: { description: '계정당 최근 게시물 수', default: '30' }
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 조회
        env:
          TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          IG: ${{ vars.INSTAGRAM_USER_ID }}
          USERS: ${{ inputs.usernames || '' }}
          LIMIT: ${{ inputs.limit || '30' }}
        run: |
          set -uo pipefail
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || LIMIT=30
          [ -n "$USERS" ] || USERS=$(grep -v '^#' config/insta-research.txt | tr -s ' \n' ',' | sed 's/,$//')
          echo '[]' > out.json
          IFS=',' read -ra arr <<< "$USERS"
          for u in "${arr[@]}"; do
            u=$(echo "$u" | tr -d ' '); [[ "$u" =~ ^[A-Za-z0-9._]+$ ]] || continue
            f="business_discovery.username($u){username,name,biography,followers_count,media_count,media.limit($LIMIT){caption,media_type,media_product_type,like_count,comments_count,view_count,timestamp,permalink}}"
            r=$(curl -sS -G -H "Authorization: Bearer $TOKEN" "https://graph.facebook.com/v21.0/$IG" --data-urlencode "fields=$f")
            echo "$r" | jq -c --arg u "$u" 'if .business_discovery then .business_discovery | {username, name, bio: ((.biography // "")[0:80]), followers: .followers_count, media_count, posts: [(.media.data // [])[] | {type: .media_type, product: .media_product_type, likes: .like_count, comments: .comments_count, views: .view_count, url: .permalink, ts: .timestamp, cap_len: ((.caption // "") | length), tags: ((.caption // "") | [scan("#[^\\s#]+")] | length), first: ((.caption // "") | split("\n")[0][0:40])}]} else {username: $u, error: (.error.message // "unknown")[0:120]} end' > one.json
            jq -s '.[0] + [.[1]]' out.json one.json > tmp.json && mv tmp.json out.json
            jq -r '.[-1] | "\(.username): \(.followers // .error)"' out.json
          done
          mv out.json ig-research.json
          # 계정별 요약: 게시물 수·릴스 조회수 중앙값·반응 중앙값
          { echo "| 계정 | 팔로워 | 릴스 조회 중앙값 | 반응(좋아요+댓글) 중앙값 |"; echo "|---|---|---|---|"; jq -r '.[] | select(.posts) | ([.posts[] | select(.product == "REELS") | .views // empty] | sort) as $v | ([.posts[] | (.likes // 0) + (.comments // 0)] | sort) as $e | "| \(.username) | \(.followers) | \($v[($v|length/2|floor)] // "-") | \($e[($e|length/2|floor)] // "-") |"' ig-research.json; echo; echo "### 아웃라이어(조회수 또는 반응이 그 계정 중앙값의 3배 이상)"; } >> "$GITHUB_STEP_SUMMARY" || true
          jq -r '.[] | select(.posts) | . as $a | ([.posts[] | select(.views) | .views] | sort) as $v | ($v[($v|length/2|floor)] // 0) as $m | .posts[] | select($m > 0 and (.views // 0) >= 3 * $m) | "- \($a.username) 조회 ×\(((.views / $m) * 10 | floor) / 10) \(.product // .type) \(.first) \(.url)"' ig-research.json | tee -a "$GITHUB_STEP_SUMMARY" || true
          # 아웃라이어: 계정마다 (좋아요+댓글)이 그 계정 중앙값의 3배 이상인 게시물 → 요약에 첫 줄 표시(docs/insta-style.md 7절)
          jq -r '.[] | select(.posts) | . as $a | ([.posts[] | (.likes // 0) + (.comments // 0)] | sort) as $v | ($v[($v|length/2|floor)] // 0) as $m | .posts[] | select($m > 0 and ((.likes // 0) + (.comments // 0)) >= 3 * $m) | "- \($a.username) ×\((((.likes // 0) + (.comments // 0)) / $m * 10 | floor) / 10) \(.product // .type) \(.first)"' ig-research.json | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with: { name: ig-research, path: ig-research.json, retention-days: 7 }
